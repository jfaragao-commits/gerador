<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0C0C">
<title>B.E.M. — Ditado Melódico</title>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0C0C; --panel:#131313; --panel-2:#191919;
  --line:#262626; --line-gold:rgba(200,160,48,.32);
  --cream:#E4E0D8; --gold:#C8A030; --gold-dim:#8a6f24;
  --green:#A4A96A; --red:#B84848;
  --muted:#7a756a; --muted-2:#4a4640;
  --paper:#F2EDDF;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;background:var(--bg);color:var(--cream);
  font-family:var(--mono);font-size:14px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:560px;margin:0 auto;padding:10px 10px 28px}

.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;border:1px solid var(--line);
  background:var(--panel);margin-bottom:8px;
}
.brand{font:600 17px/1 var(--mono);letter-spacing:.02em;color:var(--cream)}
.brand em{font-style:normal;color:var(--gold);font-weight:400}
.sub{font:400 9px/1 var(--mono);letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.tag{font:400 9px/1 var(--mono);letter-spacing:.22em;color:var(--gold);text-transform:uppercase}

.card{
  border:1px solid var(--line);background:var(--panel);
  padding:12px;margin-bottom:8px;
}
.card-title{
  font:500 10px/1 var(--mono);letter-spacing:.22em;color:var(--gold);
  text-transform:uppercase;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
}
.card-title .meta{
  color:var(--muted-2);letter-spacing:.1em;font-weight:400;
  text-transform:none;font-size:10px;text-align:right;
}
.card-title .meta.locked{
  color:var(--gold);letter-spacing:.2em;
  text-transform:uppercase;font-size:9px;
}

.ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl-grid .full{grid-column:1/-1}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl label{
  font:500 9px/1 var(--mono);letter-spacing:.16em;color:var(--gold);
  text-transform:uppercase;display:flex;gap:6px;align-items:center;
}
.ctrl label .idx{color:var(--gold-dim)}

select,input{
  width:100%;background:#080808;color:var(--cream);
  border:1px solid var(--line);border-radius:0;
  padding:10px 12px;font:400 13px var(--mono);appearance:none;
  min-height:42px;
}
select{
  background-image:
    linear-gradient(45deg,transparent 50%,var(--muted-2) 50%),
    linear-gradient(135deg,var(--muted-2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 50%, calc(100% - 9px) 50%;
  background-size:5px 5px, 5px 5px;background-repeat:no-repeat;
  padding-right:28px;
}
select:focus,input:focus{outline:0;border-color:var(--gold)}

details.advanced{
  margin:14px 0 0;border:0;background:transparent;padding:0;
}
details.advanced > summary{
  padding:10px 0 4px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font:500 9.5px/1 var(--mono);
  letter-spacing:.22em;
  text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;user-select:none;list-style:none;
}
details.advanced > summary::-webkit-details-marker{display:none}
details.advanced > summary::after{
  content:'▸';color:var(--muted);font-size:12px;
  transition:transform .15s,color .15s;
}
details.advanced[open] > summary{color:var(--gold)}
details.advanced[open] > summary::after{
  transform:rotate(90deg);color:var(--gold);
}
details.advanced > .adv-body{
  padding-top:12px;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
details.advanced .ctrl-grid + .ctrl-grid{margin-top:8px}

.range-badge{
  font:400 9px/1 var(--mono);letter-spacing:.14em;
  color:var(--gold-dim);text-transform:uppercase;
  padding:8px 0 0;
}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{
  border:1px solid var(--line);background:#080808;color:var(--cream);
  padding:12px;cursor:pointer;font:500 11px/1 var(--mono);
  letter-spacing:.12em;text-transform:uppercase;min-height:46px;
  transition:border-color .12s,color .12s,background .12s;
}
.btn:active{border-color:var(--gold);color:var(--gold)}
.btn.primary{
  grid-column:1/-1;background:var(--gold);border-color:var(--gold);
  color:#0C0C0C;font-weight:600;
}
.btn.primary:active{background:#d8b040;border-color:#d8b040;color:#0C0C0C}

.staff-outer{position:relative}
.staff-wrap{
  background:var(--paper);border:1px solid var(--line);
  padding:8px;overflow-x:auto;min-height:170px;
  -webkit-overflow-scrolling:touch;
  transition:filter .35s ease;
}
.staff-wrap svg{display:block}

.staff-wrap.blurred{
  filter: blur(11px) saturate(.7);
  pointer-events:none;
  user-select:none;
}
.staff-lock{
  position:absolute;inset:0;
  display:none;
  align-items:center;justify-content:center;
  pointer-events:none;
  font:500 10px/1 var(--mono);
  letter-spacing:.3em;
  color:var(--gold);
  text-transform:uppercase;
  text-shadow:0 1px 0 rgba(0,0,0,.6);
  background:radial-gradient(ellipse at center, rgba(12,12,12,.35) 0%, rgba(12,12,12,.15) 60%, transparent 85%);
}
.staff-wrap.blurred ~ .staff-lock{display:flex}

.quiz-option{
  display:block;width:100%;text-align:left;background:#080808;
  border:1px solid var(--line);color:var(--cream);
  padding:14px;margin:6px 0;font:400 14px var(--mono);
  letter-spacing:.06em;cursor:pointer;min-height:46px;
  transition:border-color .12s,color .12s,background .12s;
}
.quiz-option:active{border-color:var(--gold);color:var(--gold)}
.quiz-option.correct{
  border-color:var(--green);
  background:rgba(164,169,106,.10);color:var(--green);
}
.quiz-option.wrong{
  border-color:var(--red);
  background:rgba(184,72,72,.10);color:var(--red);
}

.answer{
  margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
}
.answer-degrees{
  font:500 15px/1.6 var(--mono);letter-spacing:.12em;
  color:var(--cream);margin-bottom:8px;
}
.answer-degrees .d{color:var(--gold)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{
  padding:3px 8px;border:1px solid var(--line);
  font:400 11px var(--mono);color:var(--gold);
}

details.lily{border:1px solid var(--line);background:var(--panel);margin-bottom:8px}
details.lily summary{
  cursor:pointer;list-style:none;padding:13px 14px;user-select:none;
  font:500 10px/1 var(--mono);letter-spacing:.22em;color:var(--gold);
  text-transform:uppercase;display:flex;justify-content:space-between;
  align-items:center;
}
details.lily summary::-webkit-details-marker{display:none}
details.lily summary::after{content:'+';color:var(--muted);font-size:14px;font-weight:400}
details.lily[open] summary::after{content:'−'}
.lily-source{
  white-space:pre-wrap;background:#080808;color:#cfcabd;
  padding:12px;border-top:1px solid var(--line);margin:0;
  font:400 10px/1.6 var(--mono);overflow:auto;max-height:240px;
}
.lily-actions{
  display:grid;grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line);
}
.lily-actions .btn{
  border:0;border-right:1px solid var(--line);min-height:42px;
}
.lily-actions .btn:last-child{border-right:0}

.hint{color:var(--muted);font-size:11px;padding:4px 0}

@media (max-width:360px){
  .ctrl-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<script>
window.BEM = {
  pcOf(name){ const m={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11}; return m[name] ?? 0; },
  splitSpelling(name){ return {base:name[0],acc:name.slice(1)}; },
  nameAt(letterIdx, pc){
    const letters=['C','D','E','F','G','A','B']; const natural={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
    const base=letters[((letterIdx%7)+7)%7], n=natural[base], d=((pc-n+6)%12)-6;
    if(d===0)return base; if(d===1)return base+'♯'; if(d===-1)return base+'♭'; if(d===2)return base+'𝄪'; if(d===-2)return base+'𝄫';
    return base+(d>0?'♯':'♭');
  }
};

// ── Áudio (v2.8a) ──
// Volume aumentado (peak 0.45) + harmônico uma 8ª acima em triangle
// para dar corpo. masterGain é ponto único de controle geral.
let audioCtx = null;
let masterGain = null;

function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1.0;
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

function playNote(freq, start, duration){
  const fundamental = audioCtx.createOscillator();
  const harmonic    = audioCtx.createOscillator();
  const gFund = audioCtx.createGain();
  const gHarm = audioCtx.createGain();

  fundamental.type = 'sine';
  fundamental.frequency.value = freq;

  harmonic.type = 'triangle';
  harmonic.frequency.value = freq * 2;

  const peak    = 0.45;
  const attack  = 0.012;
  const release = Math.max(0.06, duration * 0.35);

  gFund.gain.setValueAtTime(0.0001, start);
  gFund.gain.exponentialRampToValueAtTime(peak, start + attack);
  gFund.gain.setValueAtTime(peak, start + Math.max(attack, duration - release));
  gFund.gain.exponentialRampToValueAtTime(0.0001, start + duration + 0.02);

  const peakH = peak * 0.22;
  gHarm.gain.setValueAtTime(0.0001, start);
  gHarm.gain.exponentialRampToValueAtTime(peakH, start + attack);
  gHarm.gain.setValueAtTime(peakH, start + Math.max(attack, duration - release));
  gHarm.gain.exponentialRampToValueAtTime(0.0001, start + duration + 0.02);

  fundamental.connect(gFund).connect(masterGain);
  harmonic.connect(gHarm).connect(masterGain);

  fundamental.start(start);
  harmonic.start(start);
  fundamental.stop(start + duration + 0.04);
  harmonic.stop(start + duration + 0.04);
}
</script>

<script id="bem-module">
// ── MÓDULO DITADO MELÓDICO v2.8 ──
(function(){
  const SCALES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],harmonic:[0,2,3,5,7,8,11],melodic:[0,2,3,5,7,9,11],pentMajor:[0,2,4,7,9],pentMinor:[0,3,5,7,10]};
  const DEG=['1','b2','2','b3','3','4','#4','5','b6','6','b7','7'];
  const SCALE_LETTER_STEPS={major:[0,1,2,3,4,5,6],minor:[0,1,2,3,4,5,6],harmonic:[0,1,2,3,4,5,6],melodic:[0,1,2,3,4,5,6],pentMajor:[0,1,2,4,5],pentMinor:[0,2,3,4,6]};
  const LETIDX={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
  const FALLBACK_LETTER=[0,0,1,2,2,3,3,4,4,5,6,6];
  const TONICS=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
  const $=id=>document.getElementById(id);

  const TESSITURA_LOW  = 45;   // A2
  const TESSITURA_HIGH = 81;   // A5

  const MAJOR_SIG_BY_PC = {
    0:  { sig:'C',  n: 0  },
    1:  { sig:'Db', n:-5  },
    2:  { sig:'D',  n: 2  },
    3:  { sig:'Eb', n:-3  },
    4:  { sig:'E',  n: 4  },
    5:  { sig:'F',  n:-1  },
    6:  { sig:'F#', n: 6  },
    7:  { sig:'G',  n: 1  },
    8:  { sig:'Ab', n:-4  },
    9:  { sig:'A',  n: 3  },
    10: { sig:'Bb', n:-2  },
    11: { sig:'B',  n: 5  }
  };
  const SHARP_ORDER = ['F','C','G','D','A','E','B'];
  const FLAT_ORDER  = ['B','E','A','D','G','C','F'];

  function keySigInfo(tonicName, scaleType){
    const isMinor = ['minor','harmonic','melodic','pentMinor'].includes(scaleType);
    const tonicPc = BEM.pcOf(tonicName);
    const majorPc = isMinor ? (tonicPc + 3) % 12 : tonicPc;
    const info = MAJOR_SIG_BY_PC[majorPc] || { sig:'C', n:0 };
    const altered = {};
    if(info.n > 0){ for(let i=0;i<info.n;i++) altered[SHARP_ORDER[i]] = 1; }
    else if(info.n < 0){ for(let i=0;i<-info.n;i++) altered[FLAT_ORDER[i]] = -1; }
    return { vexKey: info.sig, altered };
  }

  const METER_STRUCT = {
    '2/4': { groups:2, groupDur:1,   kind:'simple',   subdivisions:2, accents:[1,0] },
    '3/4': { groups:3, groupDur:1,   kind:'simple',   subdivisions:2, accents:[1,0,0] },
    '4/4': { groups:4, groupDur:1,   kind:'simple',   subdivisions:2, accents:[1,0,1,0] },
    '6/8': { groups:2, groupDur:1.5, kind:'compound', subdivisions:3, accents:[1,0] },
    '9/8': { groups:3, groupDur:1.5, kind:'compound', subdivisions:3, accents:[1,0,0] },
    '12/8':{ groups:4, groupDur:1.5, kind:'compound', subdivisions:3, accents:[1,0,1,0] }
  };

  const GROUP_OPTIONS = {
    simple: {
      basic:      [[1]],
      eighth:     [[.5,.5]],
      varied:     [[1], [.5,.5], [.25,.25,.5], [.5,.25,.25]],
      syncopated: [[1], [.5,.5], [.75,.25], [.25,.75], [.25,.5,.25]]
    },
    compound: {
      basic:      [[1.5]],
      eighth:     [[.5,.5,.5]],
      varied:     [[1.5], [.5,.5,.5], [1,.5], [.5,1], [.25,.5,.75], [.75,.5,.25]],
      syncopated: [[1.5], [1,.5], [.5,1], [.25,.5,.75], [.75,.5,.25]]
    }
  };

  const BAR_OVERRIDES = {
    '4/4': { syncopated: [[.5,1,.5,1,1],[.5,1.5,1,1],[1,.5,1.5,1],[1,1,.5,1.5]] },
    '6/8': { syncopated: [[.5,1.5,.5,.5],[.5,.5,1.5,.5],[.5,1,1,.5]] },
    '9/8': { syncopated: [[.5,1.5,.5,1.5,.5],[.5,1,.5,.5,1.5,.5]] },
    '12/8':{ syncopated: [[.5,1.5,.5,.5,1.5,.5,.5,.5],[1.5,.5,.5,1,.5,.5,1.5]] }
  };

  function almostEqual(a,b){ return Math.abs(a-b) < 1e-9; }
  function validPattern(pattern, total){
    return Array.isArray(pattern) && pattern.length > 0 &&
      pattern.every(d => Number.isFinite(d) && d > 0) &&
      almostEqual(pattern.reduce((a,b)=>a+b,0), total);
  }
  function rhythmPatternForBar(meter, motor) {
    const S = METER_STRUCT[meter];
    const total = S.groups * S.groupDur;
    const ov = BAR_OVERRIDES[meter]?.[motor];
    if (ov && Math.random() < 0.5) {
      const candidate = ov[Math.floor(Math.random() * ov.length)].slice();
      if (validPattern(candidate, total)) return candidate;
    }
    const opts = GROUP_OPTIONS[S.kind][motor] || GROUP_OPTIONS[S.kind].basic;
    const out = [];
    for(let g=0; g<S.groups; g++){
      const valid = opts.filter(p => validPattern(p, S.groupDur));
      const pick = valid[Math.floor(Math.random() * valid.length)];
      out.push(...pick);
    }
    return out;
  }
  function rhythmDurations(meter, motor, bars) {
    return Array.from({ length: bars }, () => rhythmPatternForBar(meter, motor));
  }

  function splitDurationsAtGroupBoundaries(durs, meter) {
    const S = METER_STRUCT[meter];
    const groupDur = S.groupDur;
    const totalDur = S.groups * groupDur;
    const EPS = 1e-9;
    const groups = Array.from({length:S.groups}, () => []);
    let t = 0;

    durs.forEach((dur, attackIndex) => {
      const start = t;
      const end = Math.min(totalDur, t + dur);
      let cursor = start;
      while(cursor < end - EPS){
        const group = Math.min(S.groups - 1, Math.floor((cursor + EPS) / groupDur));
        const groupStart = group * groupDur;
        const groupEnd = Math.min(totalDur, (group + 1) * groupDur);
        const cellEnd = Math.min(end, groupEnd);
        groups[group].push({
          offset: cursor - groupStart,
          dur: cellEnd - cursor,
          isRest:false,
          tieIn: cursor > start + EPS,
          tieOut: cellEnd < end - EPS,
          group,
          attackIndex
        });
        cursor = cellEnd;
      }
      t = end;
    });
    const generated = groups.reduce((sum,g)=>sum+g.reduce((a,c)=>a+c.dur,0),0);
    if(!almostEqual(generated,totalDur)){
      throw new Error(`Ritmo inválido em ${meter}: ${generated} ≠ ${totalDur}`);
    }
    return groups;
  }

  function metricGroupsForBar(meter){
    const S = METER_STRUCT[meter];
    return Array.from({length:S.groups}, (_,g)=>({
      index:g, start:g*S.groupDur, duration:S.groupDur, accent:S.accents[g]
    }));
  }

  function spellNote(offsetFromTonic, tonicName, scaleType){
    const scaleArr = SCALES[scaleType] || SCALES.major;
    const steps    = SCALE_LETTER_STEPS[scaleType] || SCALE_LETTER_STEPS.major;
    const tonicL   = LETIDX[tonicName[0]];
    const tonicPc  = BEM.pcOf(tonicName);
    const pcOffset = ((offsetFromTonic % 12) + 12) % 12;
    const pcFromC  = ((tonicPc + offsetFromTonic) % 12 + 12) % 12;
    const k = scaleArr.indexOf(pcOffset);
    const letterIdx = k >= 0 ? tonicL + steps[k] : FALLBACK_LETTER[pcFromC];
    return BEM.nameAt(letterIdx, pcFromC);
  }
  function accToLily(u){return u==='♯'?'is':u==='♭'?'es':u==='𝄪'?'isis':u==='𝄫'?'eses':''}
  function accToVex(u){return u==='♯'?'#':u==='♭'?'b':u==='𝄪'?'##':u==='𝄫'?'bb':''}
  function accToNum(u){return u==='♯'?1:u==='♭'?-1:u==='𝄪'?2:u==='𝄫'?-2:0}

  function lilyNoteName(offset, tonic, scale, midi){
    const name = spellNote(offset, tonic, scale);
    const letter = name[0].toLowerCase(), acc = accToLily(name.slice(1));
    const oct = Math.floor(midi/12) - 1, marks = oct - 3;
    return letter + acc + (marks>0 ? "'".repeat(marks) : marks<0 ? ",".repeat(-marks) : '');
  }
  function lilyKeySpec(tonic, scaleType){
    const {base, acc} = BEM.splitSpelling(tonic);
    const lilyAcc = acc==='#'?'is':acc==='b'?'es':acc==='##'?'isis':acc==='bb'?'eses':'';
    const mode = (scaleType==='minor'||scaleType==='harmonic'||scaleType==='melodic'||scaleType==='pentMinor') ? 'minor' : 'major';
    return `\\key ${base}${lilyAcc} \\${mode}`;
  }
  function lilyDuration(b){return b===.25?'16':b===.5?'8':b===.75?'8.':b===1?'4':b===1.5?'4.':b===2?'2':b===3?'2.':b===4?'1':'4'}

  function vfDurationParts(b){
    const map = {
      0.25:  { base:'16', dots:0 },
      0.375: { base:'16', dots:1 },
      0.5:   { base:'8',  dots:0 },
      0.75:  { base:'8',  dots:1 },
      1:     { base:'q',  dots:0 },
      1.5:   { base:'q',  dots:1 },
      2:     { base:'h',  dots:0 },
      3:     { base:'h',  dots:1 },
      4:     { base:'w',  dots:0 },
      6:     { base:'w',  dots:1 }
    };
    return map[b] || { base:'q', dots:0 };
  }

  function buildPitchPool(scale, baseMidi, chromatic){
    const pool = [];
    const seen = new Set();
    const add = v => {
      const midi = baseMidi + v;
      if(midi < TESSITURA_LOW || midi > TESSITURA_HIGH) return;
      if(seen.has(v)) return;
      seen.add(v); pool.push(v);
    };
    for(let oct=-2; oct<=2; oct++){
      for(const k of scale){ add(k + 12*oct); }
    }
    if(chromatic){
      const base = pool.slice();
      for(const v of base){ add(v + 1); add(v - 1); }
    }
    pool.sort((a,b)=>a-b);
    return pool;
  }

  function nearestPoolOffset(deg, scale, pool){
    const targetPc = ((scale[deg % scale.length] % 12) + 12) % 12;
    const targetVal = scale[deg % scale.length];
    let best = null, bestDist = Infinity;
    for(const v of pool){
      const vPc = ((v % 12) + 12) % 12;
      if(vPc !== targetPc) continue;
      const d = Math.abs(v - targetVal);
      if(d < bestDist){ bestDist = d; best = v; }
    }
    return best !== null ? best : pool[0];
  }

  function scaleIndexOf(v, scale){
    const oct = Math.floor(v / 12);
    const pc = ((v % 12) + 12) % 12;
    const k = scale.indexOf(pc);
    if(k < 0) return null;
    return oct * scale.length + k;
  }

  function candidateSequence(slotCount, scale, startDeg, endDeg, range, maxLeap, motion, contour, focus){
    focus = focus || 'scale';
    const baseMidi = 60 + tonicPc();
    const pitchPool = buildPitchPool(scale, baseMidi, focus === 'chromatic');
    if(!pitchPool.length) return null;

    const startOff = nearestPoolOffset(startDeg, scale, pitchPool);
    let seq = [startOff], direction = 0;

    for(let i=1; i<slotCount; i++){
      const choices = [];
      const iPrev = scaleIndexOf(seq[i-1], scale);
      for(const v of pitchPool){
        const d = v - seq[i-1];
        if(d === 0 || Math.abs(d) > range) continue;

        const iNew = scaleIndexOf(v, scale);
        if(iPrev !== null && iNew !== null){
          const stepSize = Math.abs(iNew - iPrev);
          if(motion === 'step' && stepSize > 1) continue;
          if(motion === 'leap' && stepSize < 2) continue;
        } else {
          if(motion === 'step' && Math.abs(d) > 2) continue;
          if(motion === 'leap' && Math.abs(d) < 2) continue;
        }

        if(focus === 'thirds' && ![3,4].includes(Math.abs(d))) continue;
        if(focus === 'fourths' && ![5,7].includes(Math.abs(d))) continue;
        if(focus === 'tonic'){
          const pitchClass = ((v % 12) + 12) % 12;
          const isTonic = scale.indexOf(pitchClass) === 0;
          const isDominant = scale.indexOf(pitchClass) === (scale.length >= 5 ? 4 : 3);
          if(!isTonic && !isDominant){
            if(Math.random() < 0.75) continue;
          }
        }

        if(contour === 'asc'  && d < 0) continue;
        if(contour === 'desc' && d > 0) continue;
        if(contour === 'arch' && i < slotCount/2 && d < 0) continue;
        if(contour === 'arch' && i >= slotCount/2 && d > 0) continue;
        if(contour === 'wave' && direction !== 0 && Math.sign(d) === direction) continue;

        if(Math.abs(d) > maxLeap) continue;
        choices.push(v);
      }
      if(!choices.length) return null;
      const pick = choices[Math.floor(Math.random() * choices.length)];
      direction = Math.sign(pick - seq[i-1]);
      seq.push(pick);
    }
    const finalTarget = nearestPoolOffset(endDeg, scale, pitchPool);
    const diff = finalTarget - seq[seq.length-1];
    if(Math.abs(diff) > maxLeap) return null;
    seq[seq.length-1] = finalTarget;
    if(Math.max(...seq) - Math.min(...seq) > range) return null;
    return seq;
  }

  function parsePattern(s){return s.trim().split(/[,\s]+/).map(Number).filter(x=>Number.isFinite(x) && x!==0)}
  function slonimskySequence(targetCount){
    const p = parsePattern($('dPattern').value); if(!p.length) return null;
    const reps = Math.max(1, parseInt($('dReps').value) || 1);
    const step = p.reduce((a,b) => a+b, 0);
    let a = [0];
    for(let r=0; r<reps; r++){
      let cur = r*step;
      for(const d of p){ cur += d; a.push(cur); }
    }
    const tr = $('dTransform').value;
    if(tr === 'retrograde') a.reverse();
    if(tr === 'inversion')  a = a.map(x => -x);
    if(tr === 'retro-inv')  a = a.map(x => -x).reverse();
    if(Number.isFinite(targetCount) && targetCount > 0){
      if(a.length > targetCount) a = a.slice(0, targetCount);
      else if(a.length < targetCount){
        const base = a.slice(); let i = 0;
        while(a.length < targetCount) a.push(base[i++ % base.length]);
      }
    }
    const baseMidi = 60 + tonicPc();
    const loOff = TESSITURA_LOW  - baseMidi;
    const hiOff = TESSITURA_HIGH - baseMidi;
    const seqMin = Math.min(...a);
    const seqMax = Math.max(...a);
    const shiftLo = loOff - seqMin;
    const shiftHi = hiOff - seqMax;

    if(shiftHi < shiftLo){
      const center = Math.round((loOff + hiOff - seqMin - seqMax) / 2);
      return a.map(x => Math.max(loOff, Math.min(hiOff, x + center)));
    }
    const shift = shiftLo + Math.floor(Math.random() * (shiftHi - shiftLo + 1));
    return a.map(x => x + shift);
  }

  function tonicPc(){ return BEM.pcOf(TONICS[Number($('dKey').value) || 0]); }

  function buildModel(notes, patterns){
    const tonicName = TONICS[Number($('dKey').value) || 0];
    const scaleType = $('dScale').value;
    const meter = $('dMeter').value;
    const motor = $('dRhythm').value;
    const bars  = Math.max(1, Number($('dBars').value) || 1);
    const S = METER_STRUCT[meter];
    if(!Array.isArray(patterns) || patterns.length !== bars){
      throw new Error('Padrões rítmicos ausentes ou incompatíveis.');
    }
    const eventsPerBar = [];
    let noteIndex = 0;
    for(let b=0; b<bars; b++){
      const durs = patterns[b];
      const groups = splitDurationsAtGroupBoundaries(durs, meter);
      const cells = [];
      groups.forEach(groupCells => groupCells.forEach(c => {
        const pitch = notes[noteIndex + c.attackIndex];
        cells.push({
          ...c,
          offset: pitch !== undefined ? pitch : 0,
          bar:b+1,
          accent:S.accents[c.group] || 0
        });
      }));
      noteIndex += durs.length;
      cells.sort((a,b)=>a.group-b.group || a.offset-b.offset);
      eventsPerBar.push(cells);
    }
    if(noteIndex !== notes.length){
      throw new Error(`Modelo desalinhado: ${noteIndex} vs ${notes.length}.`);
    }
    const keySig = keySigInfo(tonicName, scaleType);
    return {
      tonicName, scaleType, meter, motor, bars, S, keySig,
      metricGroups: metricGroupsForBar(meter),
      eventsPerBar
    };
  }

  let dMode = 'melody', dCurrent = null, dRevealed = false;

  function dSetMode(m){
    dMode = m;
    $('dMelodyPanel').style.display = m === 'melody'    ? 'block' : 'none';
    $('dSlonPanel').style.display   = m === 'slonimsky' ? 'block' : 'none';
  }
  window.dSetMode = dSetMode;

  function setStaffBlurred(blurred){
    const el = $('dStaff');
    if(!el) return;
    el.classList.toggle('blurred', !!blurred);
    const metric = $('dMetric');
    if(metric) metric.classList.toggle('locked', !!blurred);
  }
  window.dSetStaffBlur = setStaffBlurred;

  function dGenerate(){
    dRevealed = false;
    let notes = null, tries = 0;
    const meter = $('dMeter').value;
    const motor = $('dRhythm').value;
    const bars = Math.max(1, Number($('dBars').value) || 1);
    const patterns = rhythmDurations(meter, motor, bars);
    const slotCount = patterns.reduce((n,d) => n + d.length, 0);

    if(dMode === 'slonimsky'){
      while(!notes && tries++ < 200) notes = slonimskySequence(slotCount);
    } else {
      const scale = SCALES[$('dScale').value];
      const range = Number($('dRange').value), maxLeap = Number($('dMaxLeap').value);
      const motion = $('dMotion').value, contour = $('dContour').value;
      const focus = $('dFocus').value;
      while(!notes && tries++ < 600){
        notes = candidateSequence(slotCount, scale, 0, 0, range, maxLeap, motion, contour, focus);
      }
    }
    if(!notes){
      const msg = dMode === 'slonimsky'
        ? 'Padrão grande demais para A2–A5. Reduza as repetições ou o padrão.'
        : 'Não foi possível gerar — afrouxe um parâmetro.';
      $('dQuizPanel').innerHTML = '<div class="card-title"><span>O que você ouviu?</span></div><div class="hint">' + msg + '</div>';
      return;
    }
    dCurrent = { notes, model: buildModel(notes, patterns) };
    const mg = dCurrent.model.metricGroups.map(g => (g.duration === 1 ? '♩' : '♩.')).join(' + ');
    $('dMetric').textContent = dCurrent.model.meter + ' · ' + mg;
    dRenderStaff();
    dRenderQuiz();
    setStaffBlurred(true);
  }
  window.dGenerate = dGenerate;

  function groupFraction(kind){
    return kind === 'compound'
      ? new Vex.Flow.Fraction(3, 8)
      : new Vex.Flow.Fraction(1, 4);
  }

  function visibleAccidental(noteName, alteredMap){
    const { base, acc } = BEM.splitSpelling(noteName);
    const letter = base.toUpperCase();
    const sigAcc = alteredMap[letter] || 0;
    const noteAcc = accToNum(acc);
    if(noteAcc === sigAcc) return '';
    if(noteAcc === 0 && sigAcc !== 0) return 'n';
    return accToVex(acc);
  }

  function dRenderStaff(){
    const host = $('dStaff'); host.innerHTML = '';
    const model = dCurrent.model;
    try{
      const VF = Vex.Flow;
      const mp = model.meter.split('/').map(Number);
      const perBarW = 240;
      const totalW = model.bars * perBarW + 20;
      const h = 180;
      const renderer = new VF.Renderer(host, VF.Renderer.Backends.SVG);
      renderer.resize(totalW, h);
      const ctx = renderer.getContext();

      const BarlineType = (VF.Barline && VF.Barline.type) || {};
      const NONE  = (BarlineType.NONE  !== undefined) ? BarlineType.NONE  : 7;
      const END   = (BarlineType.END   !== undefined) ? BarlineType.END   : 3;

      model.eventsPerBar.forEach((cells, bi) => {
        const x = 10 + bi * perBarW;
        const stave = new VF.Stave(x, 50, perBarW);

        if(bi === 0){
          stave.addClef('treble')
               .addKeySignature(model.keySig.vexKey)
               .addTimeSignature(model.meter);
        } else {
          try { stave.setBegBarType(NONE); } catch(e){}
        }
        if(bi === model.bars - 1){
          try { stave.setEndBarType(END); } catch(e){}
        }
        stave.setContext(ctx).draw();

        const tickables = [];
        const ties = [];
        let pendingTie = null;

        for(const c of cells){
          const { base: durBase, dots } = vfDurationParts(c.dur);

          if(c.isRest){
            const n = new VF.StaveNote({
              keys: ['b/4'],
              duration: durBase + 'r',
              clef: 'treble'
            });
            for(let d = 0; d < dots; d++){
              try { n.addModifier(new VF.Dot(), 0); } catch(e){}
            }
            tickables.push(n);
            pendingTie = null;
            continue;
          }

          const name = spellNote(c.offset, model.tonicName, model.scaleType);
          const { base, acc } = BEM.splitSpelling(name);
          const vexAccForKey = accToVex(acc);
          const oct = Math.floor((60 + tonicPc() + c.offset) / 12) - 1;

          const n = new VF.StaveNote({
            keys: [ base.toLowerCase() + vexAccForKey + '/' + oct ],
            duration: durBase,
            clef: 'treble'
          });

          const drawAcc = visibleAccidental(name, model.keySig.altered);
          if(drawAcc) n.addModifier(new VF.Accidental(drawAcc), 0);

          for(let d = 0; d < dots; d++){
            try { n.addModifier(new VF.Dot(), 0); } catch(e){}
          }
          tickables.push(n);

          if(c.tieIn && pendingTie){
            ties.push({ first: pendingTie, last: n });
          }
          pendingTie = c.tieOut ? n : null;
        }

        const voice = new VF.Voice({ num_beats: mp[0], beat_value: mp[1] }).setStrict(false);
        voice.addTickables(tickables);

        const fmtWidth = (bi === 0) ? perBarW - 100 : perBarW - 30;
        new VF.Formatter().joinVoices([voice]).format([voice], fmtWidth);

        const beamGroups = Array.from(
          { length: model.S.groups },
          () => groupFraction(model.S.kind)
        );
        let beams = [];
        try {
          beams = VF.Beam.generateBeams(tickables, {
            groups: beamGroups,
            beamRests: false,
            maintainStemDirections: false
          });
        } catch(e) { console.warn('B.E.M. — beaming:', e); }

        voice.draw(ctx, stave);
        beams.forEach(b => { try { b.setContext(ctx).draw(); } catch(e){} });

        ties.forEach(t => {
          try{
            new VF.StaveTie({
              first_note: t.first, last_note: t.last,
              first_indices: [0], last_indices: [0]
            }).setContext(ctx).draw();
          }catch(e){}
        });
      });
    }catch(err){
      console.error('Ditado — erro de notação:', err);
      host.innerHTML = '<div style="padding:20px;color:var(--muted);font-family:var(--mono);font-size:11px">Não foi possível desenhar a pauta.</div>';
    }
  }

  function dToLily(){
    if(!dCurrent || !dCurrent.model) return '';
    const model = dCurrent.model;
    let body = '';
    model.eventsPerBar.forEach(cells => {
      cells.forEach(c => {
        if(c.isRest){ body += lilyDuration(c.dur) + 'r '; return; }
        const n = lilyNoteName(c.offset, model.tonicName, model.scaleType, 60 + tonicPc() + c.offset);
        body += n + lilyDuration(c.dur) + (c.tieOut ? '~ ' : ' ');
      });
      body += '| ';
    });
    return `\\version "2.24.0"\n\\header { title = "B.E.M. Ditado Melódico" }\n\\score {\n  { ${lilyKeySpec(model.tonicName, model.scaleType)} \\time ${model.meter} ${body.trim()} }\n  \\layout { }\n  \\midi { \\tempo 4 = ${Math.max(30, parseInt($('dBpm').value) || 70)} }\n}`;
  }
  window.dShowLily    = () => { $('dLilyBox').open = true; $('dLilySource').textContent = dToLily(); };
  window.dCopyLily    = async () => { try{ await navigator.clipboard.writeText(dToLily()); $('dCopyLabel').textContent = '✓ Copiado'; setTimeout(()=>$('dCopyLabel').textContent='⧉ Copiar .ly',1200); }catch(e){} };
  window.dDownloadLily= () => { const blob = new Blob([dToLily()],{type:'text/plain;charset=utf-8'}), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bem-ditado.ly'; a.click(); URL.revokeObjectURL(a.href); };

  function flattenEvents(){
    const out = [];
    dCurrent.model.eventsPerBar.forEach(cells => cells.forEach(c => {
      if(c.isRest) return;
      if(c.tieIn && out.length){
        out[out.length - 1].dur += c.dur;
        return;
      }
      out.push({ offset:c.offset, dur:c.dur, bar:c.bar });
    }));
    return out;
  }

  function dPlay(){
    if(!dCurrent) return;
    initAudio();
    const bpm = Math.max(30, parseInt($('dBpm').value) || 70), beat = 60 / bpm;
    let t = audioCtx.currentTime + .1;
    const base = 60 + tonicPc();
    flattenEvents().forEach(e => {
      playNote(midiToFreq(base + e.offset), t, Math.max(.12, beat * e.dur * .85));
      t += beat * e.dur;
    });
  }
  window.dPlay     = dPlay;
  window.dPlayRoot = () => { initAudio(); playNote(midiToFreq(60 + tonicPc()), audioCtx.currentTime, 1.5); };
  window.dReveal   = () => {
    if(!dCurrent) return;
    dRevealed = true;
    setStaffBlurred(false);
    dRenderQuiz(true);
  };

  function degreeOf(offset){ return DEG[((offset % 12) + 12) % 12]; }
  function rhythmSymbol(dur){
    return dur===.25?'𝅘𝅥𝅯':dur===.5?'♪':dur===.75?'♪.':dur===1?'♩':dur===1.5?'♩.':dur===2?'𝅗𝅥':dur===3?'𝅗𝅥.':dur===4?'𝅝':String(dur);
  }
  function distractors(correct){
    const out = [correct.join(',')];
    for(let z=0; z<100 && out.length<4; z++){
      let f = correct.slice();
      const pos = 1 + Math.floor(Math.random() * Math.max(1, correct.length - 2));
      f[pos] += Math.random() < .5 ? 1 : -1;
      const s = f.join(',');
      if(!out.includes(s)) out.push(s);
    }
    return out;
  }
  function dRenderQuiz(forceReveal){
    const n = dCurrent.notes, correct = n.join(',');
    const opts = distractors(n).sort(() => Math.random() - .5);
    const answerBlock = `<div class="answer" style="${dRevealed || forceReveal ? '' : 'display:none'}" id="dAnswerBlock">
      <div class="card-title" style="margin-bottom:8px"><span>Resposta</span></div>
      <div class="answer-degrees">${n.map(x => '<span class="d">'+degreeOf(x)+'</span>').join(' – ')}</div>
      <div class="chips">${flattenEvents().map(e => `<span class="chip">${rhythmSymbol(e.dur)}</span>`).join('')}</div>
    </div>`;
    $('dQuizPanel').innerHTML = `
      <div class="card-title"><span>O que você ouviu?</span></div>
      <div id="dOpts">${opts.map(o => `<button class="quiz-option" data-value="${o}">${o.split(',').map(x => degreeOf(parseInt(x))).join(' – ')}</button>`).join('')}</div>
      ${answerBlock}`;
    document.querySelectorAll('#dOpts .quiz-option').forEach(b => b.onclick = () => {
      document.querySelectorAll('#dOpts .quiz-option').forEach(x => x.disabled = true);
      if(b.dataset.value === correct) b.classList.add('correct');
      else {
        b.classList.add('wrong');
        document.querySelectorAll('#dOpts .quiz-option').forEach(x => { if(x.dataset.value === correct) x.classList.add('correct'); });
      }
      $('dAnswerBlock').style.display = 'block';
      setStaffBlurred(false);
    });
  }

  function dInit(){
    TONICS.forEach((n, i) => $('dKey').add(new Option(n, i)));
    dSetMode('melody');
    dGenerate();
  }
  window.dInit = dInit;

  dInit();
})();
</script>
</body>
</html>
