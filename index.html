<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador Slonimsky v3 — Padrão Intervalar + Transposição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D0D;
    --gold:#C8A030;
    --gold-dim:#8a6f24;
    --paper:#EDE8DC;
    --line:#33312c;
    --panel:#161613;
    --danger:#b5533f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    padding:32px 24px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{
    border-bottom:3px solid var(--gold);
    padding-bottom:18px;
    margin-bottom:28px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.5px;
    margin:0;
    text-transform:uppercase;
  }
  h1 span{color:var(--gold);}
  .subtitle{
    font-size:12px;
    color:#8a877c;
    letter-spacing:1px;
    text-transform:uppercase;
    max-width:260px;
    text-align:right;
    line-height:1.5;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    padding:20px;
    margin-bottom:24px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:18px;
  }
  label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--gold);
    margin-bottom:6px;
  }
  select,input[type=number]{
    width:100%;
    background:#000;
    color:var(--paper);
    border:1px solid var(--line);
    padding:9px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
  }
  select:focus,input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .toggle-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:6px;
  }
  .toggle-row input{width:auto;accent-color:var(--gold);}
  .toggle-row span{font-size:12.5px;color:#c9c6ba;}
  .hint{font-size:11.5px;color:#7c7969;margin-top:8px;line-height:1.5;}
  .mode-switch{
    display:flex;gap:0;margin-bottom:20px;border:1px solid var(--line);
  }
  .mode-btn{
    flex:1;
    background:#000;
    color:#8a877c;
    border:none;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:12px 10px;
    cursor:pointer;
    border-right:1px solid var(--line);
  }
  .mode-btn:last-child{border-right:none;}
  .mode-btn.active{background:var(--gold);color:#0D0D0D;}
  .preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .preset-btn{
    background:#000;
    border:1px solid var(--line);
    color:#c9c6ba;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:6px 10px;
    cursor:pointer;
  }
  .preset-btn:hover{border-color:var(--gold);color:var(--gold);}
  .form-label{
    font-size:10px;
    color:var(--gold-dim);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:6px;
  }
  button.generate{
    margin-top:20px;
    background:var(--gold);
    color:#0D0D0D;
    border:none;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:13px 26px;
    cursor:pointer;
  }
  button.generate:hover{background:#e0b544;}
  button.generate:disabled{background:#5b5030;color:#8a8574;cursor:not-allowed;}
  .meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:8px;
  }
  .meta .count{font-size:13px;color:#8a877c;}
  .meta .count b{color:var(--gold);}
  .warn{
    background:#241d13;
    border-left:3px solid var(--danger);
    padding:9px 12px;
    font-size:12px;
    color:#d9a48f;
    margin-bottom:14px;
  }
  .result{
    border:1px solid var(--line);
    border-left:3px solid var(--gold-dim);
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }
  .result .idx{
    font-size:11px;
    color:#665f4e;
    min-width:32px;
  }
  .notes{flex:1;min-width:0;}
  .note-line{
    font-size:16px;
    letter-spacing:0.5px;
    word-break:break-word;
  }
  .note-line .pillar{color:var(--gold);font-weight:600;}
  .note-line .interp{color:#c9c6ba;}
  .note-line .sep{color:#514c3d;margin:0 3px;}
  .intervals{
    font-size:11px;
    color:#7c7969;
    margin-top:5px;
    letter-spacing:0.5px;
  }
  .classif{
    font-size:10.5px;
    color:var(--gold-dim);
    margin-top:4px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .play-btn{
    background:none;
    border:1px solid var(--gold-dim);
    color:var(--gold);
    width:38px;height:38px;
    flex-shrink:0;
    cursor:pointer;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .play-btn:hover{background:var(--gold);color:#0D0D0D;}
  .empty{
    text-align:center;
    color:#5b584a;
    padding:60px 0;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    border:1px dashed var(--line);
  }
  .legend{
    display:flex;gap:20px;margin-bottom:18px;font-size:11px;color:#8a877c;flex-wrap:wrap;
  }
  .legend span.dot{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle;}
  .legend .p .dot{background:var(--gold);}
  .legend .i .dot{background:#c9c6ba;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gerador <span>Slonimsky</span> v3</h1>
    <div class="subtitle">O padrão intervalar é o objeto gerador; os pilares são a consequência de sua transposição</div>
  </header>

  <div class="panel">
    <div class="mode-switch">
      <button class="mode-btn active" id="modeBtnPattern" data-mode="pattern">Padrão intervalar</button>
      <button class="mode-btn" id="modeBtnPillars" data-mode="pillars">Pilares — explorar tudo</button>
    </div>

    <div class="grid" style="margin-bottom:16px;">
      <div>
        <label for="startNote">Nota inicial</label>
        <select id="startNote"></select>
      </div>
    </div>

    <!-- MODO: PADRÃO INTERVALAR (v3, motor principal) -->
    <div id="patternPanel">
      <label for="patternInput">Padrão intervalar (semitons, separados por espaço — use sinal para descer)</label>
      <input type="text" id="patternInput" value="+1 +3" placeholder="ex: +1 +3  ou  +4 -1 +4 -1">
      <div class="preset-row">
        <button class="preset-btn" data-preset="+6">Trítono +6</button>
        <button class="preset-btn" data-preset="+3">Diminuta +3</button>
        <button class="preset-btn" data-preset="+1 +3">Diminuta c/ vizinha</button>
        <button class="preset-btn" data-preset="+4">Aumentada +4</button>
        <button class="preset-btn" data-preset="+4 -1 +4 -1">Aumentada zig-zag</button>
        <button class="preset-btn" data-preset="+2">Tons inteiros +2</button>
        <button class="preset-btn" data-preset="+1">Cromática +1</button>
      </div>
      <div class="grid" style="margin-top:16px;">
        <div>
          <label for="transposeStep">Transposição a cada repetição (semitons)</label>
          <input type="number" id="transposeStep" placeholder="deixe em branco = automático (soma do padrão)">
        </div>
        <div>
          <label for="repeatCount">Número de repetições</label>
          <input type="number" id="repeatCount" value="3" min="1" max="24">
        </div>
      </div>
      <div class="hint" id="patternHint"></div>
    </div>

    <!-- MODO: PILARES (v2, exploração combinatória exaustiva) -->
    <div id="pillarsPanel" style="display:none;">
      <div class="grid">
        <div>
          <label for="division">Divisão simétrica</label>
          <select id="division">
            <option value="2">2 partes — trítono (6+6)</option>
            <option value="3" selected>3 partes — diminuta (4+4+4)</option>
            <option value="4">4 partes — aumentada (3+3+3+3)</option>
            <option value="6">6 partes — tons inteiros (2×6)</option>
            <option value="12">12 partes — cromática (1×12)</option>
          </select>
        </div>
        <div>
          <label for="kcount">Notas interpoladas por intervalo</label>
          <select id="kcount"></select>
        </div>
        <div>
          <label for="orderMode">Ordem das interpoladas</label>
          <select id="orderMode">
            <option value="asc">Crescente (clássico)</option>
            <option value="zigzag">Todas as ordens (zig-zag)</option>
          </select>
        </div>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="samePattern" checked>
        <span id="sameLabel">Mesmo padrão de interpolação em todos os intervalos (o método original de Slonimsky)</span>
      </div>
      <div class="hint" id="hintText"></div>
    </div>

    <div class="grid" style="margin-top:16px;" id="transformRow">
      <div>
        <label for="transformMode">Transformação (modo pilares) / gerado automaticamente no modo padrão</label>
        <select id="transformMode">
          <option value="original">Original</option>
          <option value="retrograde">Retrógrado</option>
          <option value="inversion">Inversão</option>
          <option value="retro-inv">Retrógrado-invertido</option>
        </select>
      </div>
    </div>

    <button class="generate" id="genBtn">Gerar melodias</button>
  </div>

  <div id="resultsMeta"></div>
  <div id="results"><div class="empty">Escolha os parâmetros acima e clique em gerar</div></div>
</div>

<script>
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const CAP = 300; // texto é leve, então o limite de exibição pode ser mais alto

// populate start note select
const startSel = document.getElementById('startNote');
NOTE_NAMES.forEach((n,i)=>{
  const o = document.createElement('option');
  o.value = i; o.textContent = n;
  startSel.appendChild(o);
});

const divisionSel = document.getElementById('division');
const kSel = document.getElementById('kcount');
const orderSel = document.getElementById('orderMode');
const transformSel = document.getElementById('transformMode');
const sameCheckbox = document.getElementById('samePattern');
const hintText = document.getElementById('hintText');
const genBtn = document.getElementById('genBtn');
const resultsDiv = document.getElementById('results');
const resultsMeta = document.getElementById('resultsMeta');

const patternInput = document.getElementById('patternInput');
const transposeStepInput = document.getElementById('transposeStep');
const repeatCountInput = document.getElementById('repeatCount');
const patternHint = document.getElementById('patternHint');
const patternPanel = document.getElementById('patternPanel');
const pillarsPanel = document.getElementById('pillarsPanel');
const modeBtnPattern = document.getElementById('modeBtnPattern');
const modeBtnPillars = document.getElementById('modeBtnPillars');
const transformRow = document.getElementById('transformRow');

let currentMode = 'pattern';

function setMode(mode){
  currentMode = mode;
  modeBtnPattern.classList.toggle('active', mode==='pattern');
  modeBtnPillars.classList.toggle('active', mode==='pillars');
  patternPanel.style.display = mode==='pattern' ? '' : 'none';
  pillarsPanel.style.display = mode==='pillars' ? '' : 'none';
  transformRow.style.display = mode==='pillars' ? '' : 'none';
  if(mode==='pattern') updatePatternHint();
}
modeBtnPattern.addEventListener('click', ()=>setMode('pattern'));
modeBtnPillars.addEventListener('click', ()=>setMode('pillars'));

document.querySelectorAll('.preset-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    patternInput.value = btn.dataset.preset;
    updatePatternHint();
  });
});

function parsePattern(str){
  return str.trim().split(/[\s,]+/).filter(Boolean).map(tok=>parseInt(tok,10)).filter(v=>!isNaN(v) && v!==0);
}

function updatePatternHint(){
  const pattern = parsePattern(patternInput.value);
  if(pattern.length === 0){
    patternHint.textContent = 'Digite ao menos um intervalo (em semitons, com sinal).';
    return;
  }
  const sum = pattern.reduce((a,b)=>a+b,0);
  const step = transposeStepInput.value ? parseInt(transposeStepInput.value,10) : sum;
  const reps = parseInt(repeatCountInput.value || 1, 10);
  const totalSpan = step * reps;
  const closesOctave = totalSpan !== 0 && totalSpan % 12 === 0;
  patternHint.textContent = `Célula de ${pattern.length} intervalo(s), soma ${sum>=0?'+':''}${sum} semitons. `
    + `Transposição efetiva: ${step>=0?'+':''}${step} por repetição × ${reps} = ${totalSpan>=0?'+':''}${totalSpan} semitons no total`
    + (closesOctave ? ' (fecha em oitava(s) exata — os pontos de transposição funcionam como pilares simétricos).' : ' (não fecha em oitava exata — cadeia livre, sem simetria octaval).');
}
patternInput.addEventListener('input', updatePatternHint);
transposeStepInput.addEventListener('input', updatePatternHint);
repeatCountInput.addEventListener('input', updatePatternHint);

function buildFromPattern(start, pattern, transposeStep, repeatCount){
  const notes = [];
  for(let r=0; r<=repeatCount; r++){
    const anchor = start + r*transposeStep;
    notes.push({offset: anchor, pillar:true});
    if(r < repeatCount){
      let cursor = anchor;
      pattern.forEach(step=>{
        cursor += step;
        notes.push({offset: cursor, pillar:false});
      });
    }
  }
  return notes;
}

function factorial(n){ let r=1; for(let i=2;i<=n;i++) r*=i; return r; }

function permutations(arr){
  if(arr.length<=1) return [arr.slice()];
  const result=[];
  for(let i=0;i<arr.length;i++){
    const rest = arr.slice(0,i).concat(arr.slice(i+1));
    permutations(rest).forEach(p=>result.push([arr[i]].concat(p)));
  }
  return result;
}

function gapSize(){ return 12 / parseInt(divisionSel.value); }

function refreshKOptions(){
  const gap = gapSize();
  const maxK = gap - 1; // interior semitone slots in a gap
  kSel.innerHTML = '';
  for(let k=0;k<=maxK;k++){
    const o = document.createElement('option');
    o.value = k;
    o.textContent = k === 0 ? '0 (apenas os pilares)' : k;
    kSel.appendChild(o);
  }
  kSel.disabled = maxK === 0;
  updateHint();
}

function combinations(arr, k){
  if(k === 0) return [[]];
  if(k > arr.length) return [];
  const result = [];
  function backtrack(start, combo){
    if(combo.length === k){ result.push(combo.slice()); return; }
    for(let i=start;i<arr.length;i++){
      combo.push(arr[i]);
      backtrack(i+1, combo);
      combo.pop();
    }
  }
  backtrack(0, []);
  return result;
}

function updateHint(){
  const n = parseInt(divisionSel.value);
  const gap = gapSize();
  const k = parseInt(kSel.value || 0);
  const interior = gap - 1;
  const orderMult = orderSel.value === 'zigzag' ? factorial(k) : 1;
  const combosPerGap = binomial(interior, k) * orderMult;
  let total;
  if(sameCheckbox.checked){
    total = combosPerGap;
  } else {
    total = Math.pow(combosPerGap, n);
  }
  hintText.textContent = `${n} pilares, intervalo de ${gap} semitons entre eles, ${interior} posição(ões) interna(s) por intervalo. `
    + `Combinações possíveis: ${total.toLocaleString('pt-BR')}` + (total > CAP ? ` (mostrando as primeiras ${CAP})` : '');
}

function binomial(n,k){
  if(k<0||k>n) return 0;
  let res = 1;
  for(let i=0;i<k;i++){ res = res * (n-i) / (i+1); }
  return Math.round(res);
}

divisionSel.addEventListener('change', refreshKOptions);
kSel.addEventListener('change', updateHint);
orderSel.addEventListener('change', updateHint);
sameCheckbox.addEventListener('change', updateHint);
refreshKOptions();
setMode('pattern');

// ---- melody generation ----
function buildMelodySameCombo(start, n, gap, combo){
  // combo: array of interior offsets (1..gap-1) chosen, ascending
  const notes = []; // absolute semitone offsets from start (not mod 12), with tag pillar/interp
  for(let g=0; g<n; g++){
    const pillarOffset = g*gap;
    notes.push({offset: start+pillarOffset, pillar:true});
    combo.forEach(c=>{
      notes.push({offset: start+pillarOffset+c, pillar:false});
    });
  }
  notes.push({offset: start + n*gap, pillar:true}); // octave close
  return notes;
}

function buildMelodyVaryCombo(start, n, gap, comboPerGap){
  // comboPerGap: array length n, each an array of interior offsets for that gap
  const notes = [];
  for(let g=0; g<n; g++){
    const pillarOffset = g*gap;
    notes.push({offset: start+pillarOffset, pillar:true});
    comboPerGap[g].forEach(c=>{
      notes.push({offset: start+pillarOffset+c, pillar:false});
    });
  }
  notes.push({offset: start + n*gap, pillar:true});
  return notes;
}

function cartesianProduct(arrays, cap){
  // arrays: array of arrays. returns up to `cap` combinations, each an array picking one item per input array
  let results = [[]];
  for(const arr of arrays){
    const next = [];
    for(const prefix of results){
      for(const item of arr){
        next.push(prefix.concat([item]));
        if(next.length >= cap * 50) break; // safety valve, trimmed later
      }
    }
    results = next;
    if(results.length > cap * 200) break; // hard safety valve for huge spaces
  }
  return results.slice(0, cap);
}

function noteName(offset){
  const idx = ((offset % 12) + 12) % 12;
  return NOTE_NAMES[idx];
}

function renderMelody(notes){
  return notes.map(n => `<span class="${n.pillar?'pillar':'interp'}">${noteName(n.offset)}</span>`).join('<span class="sep">–</span>');
}

function intervalString(notes){
  const ivs = [];
  for(let i=1;i<notes.length;i++){
    ivs.push(notes[i].offset - notes[i-1].offset);
  }
  return ivs.map(v => v>=0 ? '+'+v : String(v)).join(' ');
}

// ---- transformações (retrógrado / inversão / retrógrado-invertido) ----
function applyTransform(notes, mode){
  if(mode === 'original') return notes;
  const first = notes[0].offset;
  if(mode === 'retrograde'){
    return notes.slice().reverse();
  }
  if(mode === 'inversion'){
    return notes.map(n => ({offset: 2*first - n.offset, pillar:n.pillar}));
  }
  if(mode === 'retro-inv'){
    const inv = notes.map(n => ({offset: 2*first - n.offset, pillar:n.pillar}));
    return inv.slice().reverse();
  }
  return notes;
}

// ---- classificação estrutural (coleções simétricas conhecidas) ----
const SYMMETRIC_SETS = [
  {name:'tons inteiros', pcs:[0,2,4,6,8,10]},
  {name:'tons inteiros', pcs:[1,3,5,7,9,11]},
  {name:'octatônica', pcs:[0,1,3,4,6,7,9,10]},
  {name:'octatônica', pcs:[1,2,4,5,7,8,10,11]},
  {name:'octatônica', pcs:[0,2,3,5,6,8,9,11]},
  {name:'aumentada (hexatônica)', pcs:[0,3,4,7,8,11]},
  {name:'aumentada (hexatônica)', pcs:[1,4,5,8,9,0]},
  {name:'aumentada (hexatônica)', pcs:[2,5,6,9,10,1]},
  {name:'aumentada (hexatônica)', pcs:[3,6,7,10,11,2]},
];
function classify(notes){
  const pcSet = [...new Set(notes.map(n => ((n.offset%12)+12)%12))];
  const matches = SYMMETRIC_SETS.filter(s => pcSet.every(pc => s.pcs.includes(pc)));
  if(matches.length === 0) return 'sem coleção simétrica específica (cromático/misto)';
  const uniqueNames = [...new Set(matches.map(m=>m.name))];
  return 'subconjunto de: ' + uniqueNames.join(', ');
}

// ---- audio ----
let audioCtx = null;
function playMelody(notes){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const baseMidi = 60; // C4 reference; start note offset already baked into notes[].offset relative to chosen start pitch class
  let t = audioCtx.currentTime;
  const noteDur = 0.85; // duração de cada nota, em segundos
  notes.forEach((n,i)=>{
    const midi = baseMidi + n.offset;
    const freq = 440 * Math.pow(2, (midi-69)/12);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.3, t+0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+noteDur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t+noteDur+0.03);
    t += noteDur*0.98;
  });
}

genBtn.addEventListener('click', ()=>{
  if(currentMode === 'pattern'){
    generatePatternMode();
  } else {
    generatePillarsMode();
  }
});

function generatePatternMode(){
  const start = parseInt(startSel.value);
  const pattern = parsePattern(patternInput.value);
  if(pattern.length === 0){
    resultsMeta.innerHTML = '';
    resultsDiv.innerHTML = '<div class="empty">Digite um padrão intervalar válido</div>';
    return;
  }
  const sum = pattern.reduce((a,b)=>a+b,0);
  const step = transposeStepInput.value ? parseInt(transposeStepInput.value,10) : sum;
  const reps = Math.max(1, parseInt(repeatCountInput.value || 1, 10));

  const base = buildFromPattern(start, pattern, step, reps);
  const forms = [
    {label:'Original', notes: applyTransform(base,'original')},
    {label:'Retrógrado', notes: applyTransform(base,'retrograde')},
    {label:'Inversão', notes: applyTransform(base,'inversion')},
    {label:'Retrógrado-invertido', notes: applyTransform(base,'retro-inv')},
  ];
  renderResults(forms.map(f=>f.notes), forms.length, forms.map(f=>f.label));
}

function generatePillarsMode(){
  const start = parseInt(startSel.value);
  const n = parseInt(divisionSel.value);
  const gap = gapSize();
  const k = parseInt(kSel.value || 0);
  const interior = Array.from({length: gap-1}, (_,i)=>i+1); // positions 1..gap-1
  const transformMode = transformSel.value;

  const rawCombos = combinations(interior, k);
  const variantsPerGap = orderSel.value === 'zigzag'
    ? rawCombos.flatMap(c => permutations(c))
    : rawCombos; // já em ordem crescente por construção

  let melodies = [];
  let totalCount = 0;

  if(sameCheckbox.checked){
    totalCount = variantsPerGap.length;
    const use = variantsPerGap.slice(0, CAP);
    melodies = use.map(c => applyTransform(buildMelodySameCombo(start, n, gap, c), transformMode));
  } else {
    const perGapArrays = Array.from({length:n}, ()=>variantsPerGap);
    totalCount = Math.pow(variantsPerGap.length, n);
    const combos = cartesianProduct(perGapArrays, CAP);
    melodies = combos.map(comboSet => applyTransform(buildMelodyVaryCombo(start, n, gap, comboSet), transformMode));
  }

  renderResults(melodies, totalCount);
}

function renderResults(melodies, totalCount, labels){
  resultsMeta.innerHTML = '';
  if(melodies.length === 0){
    resultsDiv.innerHTML = '<div class="empty">Nenhuma combinação para esses parâmetros</div>';
    return;
  }

  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = `<span class="p"><span class="dot"></span>pilar (ponto de transposição)</span><span class="i"><span class="dot"></span>nota do padrão intervalar</span>`;
  resultsMeta.appendChild(legend);

  if(!labels){
    const metaLine = document.createElement('div');
    metaLine.className = 'meta';
    metaLine.innerHTML = `<span class="count">Exibindo <b>${melodies.length}</b> de <b>${totalCount.toLocaleString('pt-BR')}</b> melodia(s) possíveis</span>`;
    resultsMeta.appendChild(metaLine);

    if(totalCount > melodies.length){
      const warn = document.createElement('div');
      warn.className = 'warn';
      warn.textContent = `O espaço total de combinações (${totalCount.toLocaleString('pt-BR')}) excede o limite de exibição. Reduza o nº de notas interpoladas, use "mesmo padrão" ou escolha uma divisão menor para ver o conjunto completo.`;
      resultsMeta.appendChild(warn);
    }
  }

  resultsDiv.innerHTML = '';
  melodies.forEach((notes, idx)=>{
    const row = document.createElement('div');
    row.className = 'result';
    const labelHtml = labels ? `<div class="form-label">${labels[idx]}</div>` : '';
    row.innerHTML = `
      <div class="idx">${String(idx+1).padStart(3,'0')}</div>
      <div class="notes">
        ${labelHtml}
        <div class="note-line">${renderMelody(notes)}</div>
        <div class="intervals">padrão intervalar: ${intervalString(notes)}</div>
        <div class="classif">${classify(notes)}</div>
      </div>
      <button class="play-btn" title="Tocar">▶</button>
    `;
    row.querySelector('.play-btn').addEventListener('click', ()=>playMelody(notes));
    resultsDiv.appendChild(row);
  });
}
</script>
